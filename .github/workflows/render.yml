name: Autopilot - Generate, Render, and Upload Next Video

on:
  schedule:
    - cron: '0 14 * * 1'  # Monday, 14:00 UTC
    - cron: '0 14 * * 4'  # Thursday, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload-next-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the next video in the queue
        id: pick
        run: |
          NEXT=$(ls content_queue | grep -v README.txt | sort | head -n 1)
          if [ -z "$NEXT" ]; then
            echo "Queue is empty - nothing to do this run."
            echo "next=" >> "$GITHUB_OUTPUT"
          else
            echo "Next video: $NEXT"
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
            cp "content_queue/$NEXT/narration_tagged.txt" src/scripts/narration_tagged.txt
            cp "content_queue/$NEXT/metadata.json" video_metadata.json
          fi

      - name: Set up Node.js
        if: steps.pick.outputs.next != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        if: steps.pick.outputs.next != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and emoji font support
        if: steps.pick.outputs.next != ''
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Install Node dependencies
        if: steps.pick.outputs.next != ''
        run: npm install

      - name: Install Python dependencies
        if: steps.pick.outputs.next != ''
        run: pip install edge-tts google-auth google-api-python-client

      # ---- Long-form video ----
      - name: Generate voiceover and scene timing
        if: steps.pick.outputs.next != ''
        run: python generate_multivoice.py

      - name: Enrich video description for SEO
        if: steps.pick.outputs.next != ''
        run: python enrich_metadata.py

      - name: Fill in scene visuals
        if: steps.pick.outputs.next != ''
        run: python fill_beats.py

      - name: Generate thumbnail data
        if: steps.pick.outputs.next != ''
        run: python generate_thumbnail.py

      - name: Render thumbnail image
        if: steps.pick.outputs.next != ''
        run: npx remotion still src/index.ts Thumbnail out/thumbnail.png

      - name: Render long-form video
        if: steps.pick.outputs.next != ''
        run: npx remotion render src/index.ts Explainer out/video.mp4

      - name: Upload long-form video as GitHub artifact (backup)
        if: steps.pick.outputs.next != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ steps.pick.outputs.next }}
          path: out/video.mp4

      - name: Upload long-form video to YouTube
        if: steps.pick.outputs.next != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_to_youtube.py --video out/video.mp4 --metadata video_metadata.json --thumbnail out/thumbnail.png --post-comment

      # ---- Shorts, auto-extracted from the same episode's strongest moments ----
      - name: Generate and upload Short 1 (opening hook)
        if: steps.pick.outputs.next != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python generate_short.py --index 1
          npx remotion render src/index.ts Short out/short-1.mp4
          python upload_to_youtube.py --video out/short-1.mp4 --metadata short_metadata.json

      - name: Generate and upload Short 2
        if: steps.pick.outputs.next != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python generate_short.py --index 2
          npx remotion render src/index.ts Short out/short-2.mp4
          python upload_to_youtube.py --video out/short-2.mp4 --metadata short_metadata.json

      - name: Generate and upload Short 3
        if: steps.pick.outputs.next != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python generate_short.py --index 3
          npx remotion render src/index.ts Short out/short-3.mp4
          python upload_to_youtube.py --video out/short-3.mp4 --metadata short_metadata.json

      - name: Upload all Shorts as GitHub artifacts (backup)
        if: steps.pick.outputs.next != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-${{ steps.pick.outputs.next }}
          path: out/short-*.mp4

      - name: Mark this video as published
        if: steps.pick.outputs.next != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p content_published
          git mv "content_queue/${{ steps.pick.outputs.next }}" "content_published/${{ steps.pick.outputs.next }}"
          git commit -m "Auto-published ${{ steps.pick.outputs.next }} (long-form + short)"
          git push
